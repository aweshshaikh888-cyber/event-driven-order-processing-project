apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: order-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: order-system/notification-service:latest
          command: ["node", "services/notification-service/dist/index.js"]
          ports:
            - containerPort: 3004
          envFrom:
            - configMapRef:
                name: order-system-config
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: order-system
spec:
  selector:
    app: notification-service
  ports:
    - port: 3004
      targetPort: 3004
