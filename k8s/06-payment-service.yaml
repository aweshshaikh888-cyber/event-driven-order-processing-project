apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: order-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: order-system/payment-service:latest
          command: ["node", "services/payment-service/dist/index.js"]
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: order-system-config
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: order-system
spec:
  selector:
    app: payment-service
  ports:
    - port: 3002
      targetPort: 3002
