apiVersion: v1
kind: ConfigMap
metadata:
  name: order-system-config
  namespace: order-system
data:
  NODE_ENV: "production"
  KAFKA_BROKERS: "kafka-service:9092"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector:4318/v1/traces"
  ORDER_DB_URL: "postgres://postgres:postgres@postgres-service:5432/order_db"
  PAYMENT_DB_URL: "postgres://postgres:postgres@postgres-service:5432/payment_db"
  INVENTORY_DB_URL: "postgres://postgres:postgres@postgres-service:5432/inventory_db"
  NOTIFICATION_DB_URL: "postgres://postgres:postgres@postgres-service:5432/notification_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: order-system-secret
  namespace: order-system
type: Opaque
data:
  POSTGRES_PASSWORD: cG9zdGdyZXM= # base64 for 'postgres'
